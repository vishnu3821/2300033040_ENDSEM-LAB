server {
  listen 80;
  server_name _;

  # Serve static files
  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # Cache immutable build assets generated by Vite (hashed filenames)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # For everything else, serve the SPA index.html (client-side routing)
  location / {
    try_files $uri /index.html;
  }

  # Health endpoint
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
